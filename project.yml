name: SameQ
options:
  bundleIdPrefix: com.nakakei6439
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SameQ:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SameQ
    info:
      path: SameQ/Info.plist
      properties:
        CFBundleDisplayName: SameQ
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakakei6439.SameQ
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  SameQUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SameQUITests
    dependencies:
      - target: SameQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakakei6439.SameQUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SameQ

schemes:
  SameQ:
    build:
      targets:
        SameQ: all
        SameQUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SameQUITests
    archive:
      config: Release
