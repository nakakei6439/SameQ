name: SameQ
options:
  bundleIdPrefix: com.nakakei6439
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# スプリント14（F37: Plus課金基盤のRevenueCat化）のみ、SPM 依存として
# RevenueCat SDK を取り込む。これは spec.md 行23 / 行115 / 行352 が指定する
# RevenueCat への差し替えを実現するための唯一の例外で、spec.md 行11 の
# 「外部パッケージ依存はゼロ」ルールは本 SPM 依存（Purchases パッケージ）に
# 限り緩和される（2026-08-27 ユーザー確定）。
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "7PTQ6W4R3T"
    CODE_SIGN_STYLE: Automatic
    # スプリント14: GenerateSecrets スクリプトが .env.local を読みに
    # ファイルシステム全体へアクセスできるよう、ユーザースクリプトサンドボックスを無効化。
    # サンドボックスを活かすと `Operation not permitted` で生成が失敗する。
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 2026-08-30: CFBundleDevelopmentRegion を固定で ja にする。
    # (前は $(DEVELOPMENT_LANGUAGE) で xcodegen デフォルトの "en" が
    # 入っていたため、日本向けアプリにもかかわらず開発言語が en 扱いだった)
    DEVELOPMENT_LANGUAGE: ja

targets:
  SameQ:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SameQ
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    info:
      path: SameQ/Info.plist
      properties:
        CFBundleDisplayName: SameQ
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "9"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        # 2026-08-30: TestFlight の "What to Test" ダイアログに
        # 日本語 / English の両タブを出すため、対応言語を宣言する。
        # アプリ本体の i18n は SameQ/L10n.swift の `useEnglish` で
        # ランタイム切替しているため、.strings / .xcstrings ファイルは
        # 不要（xcodegen / Xcode の Localizations 設定も最小）。
        # 第1引数を ja にすると CFBundleDevelopmentRegion とも整合。
        CFBundleLocalizations:
          - ja
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakakei6439.SameQ
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # スプリント14 attempt 6: StoreKit Testing を有効化。
        # シミュレータで Configuration.storekit の商品定義が
        # `Product.products(for:)` / `purchase()` に反映されるようにする。
        # 実機ビルドでは効果がなく、App Store Connect の本物の商品を引く。
        ENABLE_STOREKIT_TESTING: YES
    # スプリント14（F37）: ビルド時に .env.local から Secrets.swift を生成する。
    # RevenueCatPlusService は生成された Secrets.revenueCatAPIKey を読み込んで
    # Purchases.configure(withAPIKey:) を呼ぶ。Secrets.swift は .gitignore 対象。
    # preBuildScripts にして "Compile Sources" より先に走らせ、
    # Secrets.swift を同ターゲットの Sources フォルダに置くことで
    # xcodegen が次回の generate で勝手に拾う。
    preBuildScripts:
      - name: GenerateSecrets
        script: |
          "${SRCROOT}/scripts/generate-secrets.sh"
        outputFiles:
          - "$(SRCROOT)/SameQ/Secrets.swift"
        basedOnDependencyAnalysis: false

  SameQTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SameQTests
    dependencies:
      - target: SameQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakakei6439.SameQTests
        GENERATE_INFOPLIST_FILE: YES

  SameQUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SameQUITests
    dependencies:
      - target: SameQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nakakei6439.SameQUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SameQ

schemes:
  SameQ:
    build:
      targets:
        SameQ: all
        SameQTests: [test]
        SameQUITests: [test]
    run:
      config: Debug
      # スプリント14 attempt 6: StoreKit Testing 構成をスキームに登録。
      # `-SameQUseStoreKitPlus` 経路でシミュレータを起動したとき、
      # `StoreKitPlusService.availableProducts()` / `purchase(_:)` が
      # この構成ファイルの商品定義を使って動作するようにする。
      # 実機では App Store Connect の本物の `com.nakakei6439.SameQ.plus.monthly`
      # が解決されるため影響なし。
      storeKitConfiguration: SameQ/Configuration.storekit
    test:
      config: Debug
      targets:
        - SameQTests
        - SameQUITests
      storeKitConfiguration: SameQ/Configuration.storekit
    archive:
      config: Release
